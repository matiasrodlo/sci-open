services:
  redis:
    # By digest as well as tag, like the Node base in the Dockerfiles, so a
    # pull cannot change what runs. Dependabot proposes the moves.
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      # Bound to the loopback interface, not to every one. The dev servers run
      # on the host and reach Redis through this mapping, so it stays — but
      # `6379:6379` published an unauthenticated Redis on every address the host
      # answers on. That is fine on a laptop and is what the README's workflow
      # uses; it is not fine on the server this same file invites, with its
      # production NODE_ENV and `restart: unless-stopped`. The `api` service
      # does not use this mapping at all: it reaches Redis over the compose
      # network by service name.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    # Twice `--maxmemory`: an AOF rewrite forks, and pages written during it are
    # copied, so the data can briefly be held twice.
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Published on loopback only, like Redis. Browsers reach the API through
    # `web`, which forwards only the public routes; published on every
    # interface, the API — admin routes included — was reachable from anywhere
    # that could reach the host, around the web tier entirely. Operators on the
    # host still have it at localhost:4000.
    ports:
      - "127.0.0.1:4000:4000"
    # A search can take about thirty seconds end to end, and on SIGTERM the
    # server finishes the ones running before it exits. Docker's default ten
    # seconds would kill it mid-drain.
    stop_grace_period: 40s
    # What the caches may hold, at their defaults, is 448 MB counted as JSON:
    # 256 for papers, 128 for the fan-outs and 64 for the result sets. Live,
    # that is more — a string outside Latin-1 takes two bytes a character, and
    # the held sets measured at 2.6 to 3.2 times what they were charged — so
    # about 1.2 GB of heap when every budget is full, beside the service
    # itself. Node sizes its heap at half the container's limit when told
    # nothing (measured: 792 MB under 1.5 GB), so the heap is set here and the
    # limit leaves room above it for buffers and native memory. Raise both
    # together, and with the budgets — see docs/configuration.md.
    mem_limit: 2g
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NODE_OPTIONS=--max-old-space-size=1536
      - REDIS_URL=redis://redis:6379
      # UNPAYWALL_EMAIL is not optional — Unpaywall answers 422 without a
      # contact address, and OpenAlex routes callers who identify themselves
      # into a faster pool.
      - UNPAYWALL_EMAIL=${UNPAYWALL_EMAIL:-}
      # Every provider key the service actually reads. DOAJ and DataCite were
      # missing while their three siblings were passed, so a key set in .env
      # reached the process locally and silently did not reach the container.
      # Empty is the right default: a placeholder is a wrong credential, and
      # DataCite answers a wrong bearer token with 401 where no header at all
      # answers 200.
      - CORE_API_KEY=${CORE_API_KEY:-}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - DOAJ_API_KEY=${DOAJ_API_KEY:-}
      - DATACITE_API_KEY=${DATACITE_API_KEY:-}
      # Added with the key itself and missed here, which is the same defect the
      # comment above describes and the reason `compose-env.test.ts` now exists.
      # Without it a container's OpenAlex traffic is metered at the anonymous
      # rate however carefully the key was set in `.env`.
      - OPENALEX_API_KEY=${OPENALEX_API_KEY:-}
      # Without this the cache and performance routes are disabled rather than
      # served unauthenticated, so there was no way to enable them in a
      # container at all.
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      # Which hops in front of this service may state the caller's address.
      # Every browser request arrives via `web`, so without this the rate limit
      # is one bucket for all visitors rather than one each. The hop to name is
      # `web` — its address or this network's CIDR — and only once a proxy in
      # front of `web` appends the visitor's address: `web` itself passes on
      # whatever X-Forwarded-For a visitor sent. Left empty by default because
      # plain compose has no such proxy, and because port 4000 is published on
      # the host's loopback, so trusting the bridge network also trusts any
      # process on the host.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # What that trust setting is counting. Empty uses 120 per minute.
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-}
      # The PDF proxy's own budget, separate because it streams up to 50 MB per
      # call and search does not. Empty uses 20 per window.
      - RATE_LIMIT_DOWNLOAD_MAX=${RATE_LIMIT_DOWNLOAD_MAX:-}
      # Searches that resolve a result set of their own — a new query or a new
      # filter, not a page or a sort of one already run. Each is some three
      # hundred upstream requests. Empty uses 30 per window.
      - RATE_LIMIT_NEW_SEARCH_MAX=${RATE_LIMIT_NEW_SEARCH_MAX:-}
      # Records read from each provider. Empty uses 600; the cap is 2000, and
      # the cost is per provider per page, so raising it multiplies upstream
      # requests. Raise SEARCH_RESCUE_BUDGET_MS with it.
      - SEARCH_DEPTH=${SEARCH_DEPTH:-}
      # The open-access gate's rescue pass: how many papers it may ask about,
      # and how long the whole pass gets. The budget is the one that binds on a
      # broad query — see docs/configuration.md.
      - SEARCH_RESCUE_LIMIT=${SEARCH_RESCUE_LIMIT:-}
      - SEARCH_RESCUE_BUDGET_MS=${SEARCH_RESCUE_BUDGET_MS:-}
      # `off` counts every facet over what was read, as before the sources were
      # asked for their own counts. Empty asks them — see docs/env.example.
      - SEARCH_FACET_COUNTS=${SEARCH_FACET_COUNTS:-}
      # Budgets for the two in-process caches, in bytes. Both count serialised
      # size, so a container memory limit wants to be comfortably more than
      # their sum. Empty uses the defaults: 256 MB of responses, 128 MB of
      # provider fan-outs.
      - CACHE_MAX_BYTES=${CACHE_MAX_BYTES:-}
      - PROVIDER_CACHE_MAX_BYTES=${PROVIDER_CACHE_MAX_BYTES:-}
      # How long a failed Redis stays written off before it is tried again.
      - CACHE_REDIS_COOLDOWN_MS=${CACHE_REDIS_COOLDOWN_MS:-}
      # Connection pooling for the outbound provider calls. Every one of these
      # is documented and none of them reached the container, which is exactly
      # the kind of setting whose absence looks like the tuning not helping.
      - HTTP_POOL_MAX_SOCKETS=${HTTP_POOL_MAX_SOCKETS:-}
      - HTTP_POOL_KEEP_ALIVE_TIMEOUT=${HTTP_POOL_KEEP_ALIVE_TIMEOUT:-}
      - HTTP_POOL_TIMEOUT=${HTTP_POOL_TIMEOUT:-}
      - HTTP_POOL_RETRY_ATTEMPTS=${HTTP_POOL_RETRY_ATTEMPTS:-}
      - HTTP_POOL_RETRY_DELAY=${HTTP_POOL_RETRY_DELAY:-}
      # The same, per upstream, as a JSON object over the settings above. Read
      # under computed names, so the check that keeps this list whole could not
      # see them, and none of the thirteen reached the container.
      - OPENALEX_POOL_CONFIG=${OPENALEX_POOL_CONFIG:-}
      - CROSSREF_POOL_CONFIG=${CROSSREF_POOL_CONFIG:-}
      - UNPAYWALL_POOL_CONFIG=${UNPAYWALL_POOL_CONFIG:-}
      - DATACITE_POOL_CONFIG=${DATACITE_POOL_CONFIG:-}
      - NCBI_POOL_CONFIG=${NCBI_POOL_CONFIG:-}
      - ARXIV_POOL_CONFIG=${ARXIV_POOL_CONFIG:-}
      - BIORXIV_POOL_CONFIG=${BIORXIV_POOL_CONFIG:-}
      - CORE_POOL_CONFIG=${CORE_POOL_CONFIG:-}
      - DOAJ_POOL_CONFIG=${DOAJ_POOL_CONFIG:-}
      - EUROPEPMC_POOL_CONFIG=${EUROPEPMC_POOL_CONFIG:-}
      - OPENAIRE_POOL_CONFIG=${OPENAIRE_POOL_CONFIG:-}
      - OPENCITATIONS_POOL_CONFIG=${OPENCITATIONS_POOL_CONFIG:-}
      - PLOS_POOL_CONFIG=${PLOS_POOL_CONFIG:-}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # The image declares its own HEALTHCHECK against /health; this is what lets
    # `web` wait for it rather than racing it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No bind mount: the service runs the image's compiled output. Mounting the
    # host tree over /app would shadow apps/api/dist, which is gitignored build
    # output and absent in a fresh clone.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Where the API is, read per request rather than baked at build time.
      # Deliberately not NEXT_PUBLIC_*: that prefix is what makes Next
      # substitute a value into the bundle at compile time.
      #
      # Fixed here rather than read from `.env`, for the reason `REDIS_URL` is
      # fixed on the api service: this web talks to the api service on the
      # compose network, whatever the host file says. It used to be taken from
      # `.env` with this address as the fallback — and `.env`, copied from
      # `docs/env.example` by the README's Quick Start, sets
      # `API_ORIGIN=http://localhost:4000` for the dev servers, so the fallback
      # never applied and the container forwarded every request to itself.
      # Measured: every search answered 502, "The API is unreachable", while all
      # three services reported healthy — web's check fetched `/`, which never
      # calls the API; it now fetches `/api/health`, which does.
      # `compose-env.test.ts` holds this line in place.
      - API_ORIGIN=http://api:4000
    restart: unless-stopped
    # It holds no cache of its own; this is the server rendering pages and
    # forwarding requests, at 64 MB idle. Node gives itself half of it.
    mem_limit: 1g
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # `/api/health` asks the API, which `/` never did: a web tier that
      # cannot reach it reported healthy while every search answered 502.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  redis_data:
