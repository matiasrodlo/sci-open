services:
  redis:
    image: redis:7-alpine
    ports:
      # Bound to the loopback interface, not to every one. The dev servers run
      # on the host and reach Redis through this mapping, so it stays — but
      # `6379:6379` published an unauthenticated Redis on every address the host
      # answers on. That is fine on a laptop and is what the README's workflow
      # uses; it is not fine on the server this same file invites, with its
      # production NODE_ENV and `restart: unless-stopped`. The `api` service
      # does not use this mapping at all: it reaches Redis over the compose
      # network by service name.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      # UNPAYWALL_EMAIL is not optional — Unpaywall answers 422 without a
      # contact address, and OpenAlex routes callers who identify themselves
      # into a faster pool.
      - UNPAYWALL_EMAIL=${UNPAYWALL_EMAIL:-}
      # Every provider key the service actually reads. DOAJ and DataCite were
      # missing while their three siblings were passed, so a key set in .env
      # reached the process locally and silently did not reach the container.
      # Empty is the right default: a placeholder is a wrong credential, and
      # DataCite answers a wrong bearer token with 401 where no header at all
      # answers 200.
      - CORE_API_KEY=${CORE_API_KEY:-}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - DOAJ_API_KEY=${DOAJ_API_KEY:-}
      - DATACITE_API_KEY=${DATACITE_API_KEY:-}
      # Without this the cache and performance routes are disabled rather than
      # served unauthenticated, so there was no way to enable them in a
      # container at all.
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      # Which hops in front of this service may state the caller's address.
      # Every browser request arrives via `web`, so without this the rate limit
      # is one bucket for all visitors rather than one each. Left empty by
      # default because the safe value depends on who can reach port 4000: the
      # compose file publishes it on the host, so trusting the bridge network
      # would also trust anything on the host. Set it once that port is closed
      # or the deployment is behind a known proxy.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # Budgets for the two in-process caches, in bytes. Both count serialised
      # size, so a container memory limit wants to be comfortably more than
      # their sum. Empty uses the defaults: 256 MB of responses, 128 MB of
      # provider fan-outs.
      - CACHE_MAX_BYTES=${CACHE_MAX_BYTES:-}
      - PROVIDER_CACHE_MAX_BYTES=${PROVIDER_CACHE_MAX_BYTES:-}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # The image declares its own HEALTHCHECK against /health; this is what lets
    # `web` wait for it rather than racing it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No bind mount: the service runs the image's compiled output. Mounting the
    # host tree over /app would shadow apps/api/dist, which is gitignored build
    # output and absent in a fresh clone.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Where the API is, read per request rather than baked at build time.
      # Deliberately not NEXT_PUBLIC_*: that prefix is what makes Next
      # substitute a value into the bundle at compile time.
      - API_ORIGIN=${API_ORIGIN:-http://api:4000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  redis_data:
