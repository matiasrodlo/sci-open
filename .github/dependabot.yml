# Keeps the pins current. The workflows' actions are pinned to commits (see
# .github/workflows/ci.yml), which stops a moved tag from changing what runs —
# and also stops a fix from arriving on its own. These proposals are how the
# fixes arrive instead: each one is a pull request, so the new commit is
# reviewed and goes through CI before anything uses it.
#
# npm is left out on purpose. The dependency audit in CI fails on any high or
# critical advisory, which is the signal that matters there; a pull request for
# every patch release of every package would bury it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
