name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `typecheck` and `test` both depend on ^build, so turbo builds the
      # shared package first; the apps compile against its dist output.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Every suite runs offline against committed fixtures. If this job ever
      # needs network access, something has leaked into the unit suite.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Blocking, as of phase 12. It was `continue-on-error` while the tree
    # carried 107 advisories; `pnpm update` plus two `pnpm.overrides` entries
    # cleared 97 of them, and the ten that remain are each blocked on a major
    # upgrade and named in scripts/audit-gate.mjs. The gate fails on anything
    # not on that list, which is the only version of it worth running.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm audit --audit-level high` is all-or-nothing, and pnpm's own
      # `auditConfig.ignoreGhsas` needs pnpm 9 while this repo pins 8.10.0.
      # The gate script holds the accepted list instead, where each entry has
      # to carry a reason and the upgrade that removes it.
      - name: Audit
        run: node scripts/audit-gate.mjs
