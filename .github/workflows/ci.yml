name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read the code and nothing else. Without this block the token took the
# repository's default scope, which can be write to everything; no job here
# writes anywhere. A job that needs more asks for it itself.
#
# Every action is pinned to a commit, with the release it was in a comment
# beside it: a tag can be moved to other code after it was reviewed, which is
# how the trivy-action and tj-actions/changed-files compromises reached the
# workflows that trusted them. Dependabot proposes the moves
# (.github/dependabot.yml).
permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.10.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `typecheck` and `test` both depend on ^build, so turbo builds the
      # shared package first; the apps compile against its dist output.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Every suite runs offline against committed fixtures. If this job ever
      # needs network access, something has leaked into the unit suite.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  images:
    name: docker images
    runs-on: ubuntu-latest
    # `compose` is the shipping path and nothing in CI touched it, so a
    # Dockerfile could break and land on `main` with every check green. The
    # ways it breaks are ones the other jobs cannot see by construction: they
    # run against the workspace with `node_modules` present and every package
    # linked, while the images install from the lockfile inside a scratch
    # container and copy a deliberately narrow subset of the tree. A new
    # workspace package, a dependency that needs a build toolchain the Alpine
    # base lacks, a file the `COPY` lines do not name — each is invisible until
    # something builds the image.
    #
    # Build only. Nothing is pushed and nothing is run: the assertion is that
    # both images build from a clean checkout, which is the part that was
    # unasserted.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Separate steps rather than one `docker compose build` so a failure names
      # which image failed, and so the two get their own cache scopes — they
      # share a base layer but diverge immediately, and one scope would have
      # them evicting each other.
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: open-access-explorer-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: open-access-explorer-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # The dependency audit sees the lockfile; this sees what ships — the
      # Alpine packages and Node underneath the app as well as its modules.
      # It fails on a high or critical vulnerability that has a fix, the bar
      # the audit job holds the lockfile to: one with no fix yet is reported
      # and does not fail, since nothing in this repository could clear it.
      #
      # The scanner is the Trivy image, pinned by digest, rather than
      # aquasecurity/trivy-action. In March 2026 that action's tags were moved
      # to credential-stealing code (GHSA-69fq-xp46-6x23), and an image named
      # by digest was unaffected by any of it. Trivy reports usage and checks
      # for updates unless told not to; a pinned scanner in CI needs neither.
      - name: Scan images
        run: |
          for image in open-access-explorer-api:ci open-access-explorer-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
              --disable-telemetry --skip-version-check "$image"
          done

      # The images are only half of what compose has to get right. This parses
      # the file, resolves every interpolation and validates the schema, which
      # is what catches a typo in a service name or an environment entry that
      # does not parse — cheap, and the file is edited more often than the
      # Dockerfiles are.
      - name: Validate compose file
        run: docker compose config --quiet

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    # The whole history, not the tip: a key committed and then deleted is still
    # in every clone. Findings that are not secrets are listed, with what each
    # one is, in .gitleaksignore.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks image, pinned by digest for the reason the scanner above is.
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --redact --no-banner --exit-code 1

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Blocking, as of phase 12. It was `continue-on-error` while the tree
    # carried 107 advisories; `pnpm update` plus two `pnpm.overrides` entries
    # cleared 97 of them, and the Fastify 5 and Next 15 upgrades cleared the
    # last ten. `ACCEPTED` in scripts/audit-gate.mjs is empty, and an entry
    # added there has to name its reason and the upgrade that removes it. The
    # gate fails on any high or critical advisory not on that list, which is
    # the only version of it worth running.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.10.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm audit --audit-level high` is all-or-nothing, and pnpm's own
      # `auditConfig.ignoreGhsas` needs pnpm 9 while this repo pins 8.10.0.
      # The gate script holds the accepted list instead, where each entry has
      # to carry a reason and the upgrade that removes it.
      - name: Audit
        run: node scripts/audit-gate.mjs
