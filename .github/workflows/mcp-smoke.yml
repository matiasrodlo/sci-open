name: MCP live smoke

# Every MCP tool once against the live sources, through the built stdio
# binary (packages/mcp/scripts/smoke.ts). Nightly and on demand, never on a
# pull request: it needs the network, and an outage upstream must not block a
# merge. GitHub mails a scheduled run's failure only to whoever last changed
# its cron, so the badge in packages/mcp/README.md is how everyone else sees it.
on:
  schedule:
    - cron: '17 4 * * *' # daily, off the hour
  workflow_dispatch:

# Read the code and nothing else, as in ci.yml.
permissions:
  contents: read

jobs:
  smoke:
    name: every tool against the live sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8.10.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=sci-open-mcp

      - name: Smoke
        working-directory: packages/mcp
        run: pnpm exec tsx scripts/smoke.ts
        env:
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
